<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceptance Notes</title>
<style>
body {font:18px system-ui,sans-serif;background:#f4f5fa;color:#172033;margin:0;padding:48px}main{max-width:680px;margin:auto;background:white;padding:32px;border-radius:16px}label,input{display:block}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;margin:12px 0}button{font:inherit;padding:12px 18px;margin:8px 8px 8px 0;cursor:pointer}#status{min-height:28px}li{padding:8px}small{color:#536078}
</style>
<main>
<h1>Acceptance Notes</h1>
<p>Save a short note in this browser. Reload saved notes to check that your work was kept.</p>
<form id="note-form">
<label for="note">Note</label><input id="note" autocomplete="off" placeholder="Write a short note">
<button type="submit">Save note</button>
</form>
<button id="reload" type="button">Reload saved notes</button>
<p id="status" role="status" aria-live="polite"></p>
<h2>Saved notes</h2><ul id="notes"></ul>
<small>Isolated acceptance demo. Use disposable test text only.</small>
</main>
<script>
const key = 'midscene-context-pilot-notes';
const input = document.querySelector('#note');
const status = document.querySelector('#status');
const list = document.querySelector('#notes');
let notes = JSON.parse(localStorage.getItem(key) || '[]');
function render() {
  list.replaceChildren(...notes.map(note => {
    const li = document.createElement('li');
    li.textContent = note;
    return li;
  }));
}
document.querySelector('#note-form').addEventListener('submit', event => {
  event.preventDefault();
  const value = input.value.trim();
  if (!value) { status.textContent = 'Enter a note before saving.'; return; }
  notes.push(value);
  localStorage.setItem(key, JSON.stringify(notes));
  input.value = '';
  status.textContent = 'Note saved.';
  render();
});
document.querySelector('#reload').addEventListener('click', () => {
  notes = JSON.parse(localStorage.getItem(key) || '[]');
  status.textContent = 'Saved notes reloaded.';
  render();
});
render();
</script>
</html>
